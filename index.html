<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10172b">
  <title>Orbit — Space Exploration Quiz</title>
  <style>
    :root {
      color-scheme: dark light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --bg: #0c1222;
      --surface: #141d32;
      --surface-raised: #1a2640;
      --text: #f2f5ff;
      --muted: #9daac5;
      --line: #2b3855;
      --accent: #9b8cff;
      --accent-strong: #7864f5;
      --correct: #39d6a0;
      --wrong: #ff6b7b;
      --grid: rgb(255 255 255 / 3%);
      --shadow: 0 24px 80px rgb(0 0 0 / 28%);
      --panel-glow: rgb(155 140 255 / 12%);
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f4f6fc;
        --surface: #fff;
        --surface-raised: #f6f7fd;
        --text: #19213a;
        --muted: #68728b;
        --line: #e2e6f0;
        --accent: #6959e8;
        --accent-strong: #5543d7;
        --correct: #08724f;
        --wrong: #c9364d;
        --grid: rgb(36 48 82 / 4%);
        --shadow: 0 24px 80px rgb(41 52 91 / 12%);
        --panel-glow: rgb(105 89 232 / 8%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 0%, rgb(120 100 245 / 16%), transparent 48%),
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        var(--bg);
      background-size: auto, 32px 32px, 32px 32px, auto;
      font-size: 15px;
      line-height: 1.55;
    }

    .quiz { width: min(100%, 560px); }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 4px 14px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .brand-name { display: flex; align-items: center; gap: 10px; }

    .brand-mark {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border: 1px solid rgb(155 140 255 / 45%);
      border-radius: 50%;
      color: var(--accent);
      background: rgb(155 140 255 / 10%);
      font-size: 16px;
      letter-spacing: 0;
    }

    .brand-code { color: var(--muted); font-size: 10px; letter-spacing: .1em; }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow), inset 0 1px 0 rgb(255 255 255 / 5%);
    }

    .card::before {
      position: absolute;
      z-index: 1;
      inset: 5px;
      border: 1px solid var(--panel-glow);
      border-radius: 13px;
      content: "";
      pointer-events: none;
    }

    .console-header {
      position: relative;
      min-height: 68px;
      padding: 14px clamp(22px, 5vw, 34px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(90deg, var(--panel-glow), transparent 62%),
        repeating-linear-gradient(90deg, transparent 0 35px, var(--grid) 35px 36px),
        var(--surface-raised);
    }

    .console-header::after {
      position: absolute;
      right: 0;
      bottom: -1px;
      left: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: .55;
      content: "";
      pointer-events: none;
    }

    .console-title { display: flex; align-items: center; gap: 11px; }

    .console-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
      border-radius: 10px;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, var(--surface));
      font-size: 17px;
    }

    .console-heading { display: grid; line-height: 1.25; }
    .console-heading span { color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .14em; }
    .console-heading strong { font-size: 13px; letter-spacing: .01em; }

    .console-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 1px solid color-mix(in srgb, var(--correct) 35%, var(--line));
      border-radius: 999px;
      color: var(--correct);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .09em;
      white-space: nowrap;
      background: color-mix(in srgb, var(--correct) 7%, var(--surface));
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--correct);
      box-shadow: 0 0 10px color-mix(in srgb, var(--correct) 70%, transparent);
      animation: signal-pulse 2s ease-in-out infinite;
    }

    .card-content { padding: clamp(24px, 6vw, 38px); }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .score {
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      background: var(--surface);
      white-space: nowrap;
    }

    .score strong { color: var(--accent); }

    .progress-track {
      height: 10px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: repeating-linear-gradient(90deg, var(--surface-raised) 0 9%, var(--surface) 9% 10%);
      box-shadow: inset 0 1px 2px rgb(0 0 0 / 8%);
    }

    .progress-fill {
      width: 10%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent-strong), #bd82ff);
      box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 55%, transparent);
      transition: width 420ms cubic-bezier(.2, .8, .2, 1);
      position: relative;
    }

    .progress-fill::after {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 3px;
      background: #fff;
      box-shadow: 0 0 8px #fff;
      content: "";
      opacity: .8;
    }

    .eyebrow {
      margin: 26px 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(23px, 5vw, 30px);
      line-height: 1.22;
      letter-spacing: -.035em;
    }

    .hint { margin-bottom: 24px; color: var(--muted); font-size: 14px; }

    .answers { display: grid; gap: 11px; }

    .answer {
      width: 100%;
      min-height: 54px;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      gap: 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--text);
      background: var(--surface-raised);
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .answer:not(:disabled):hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .answer:focus-visible, .next:focus-visible, .restart:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .answer:disabled { cursor: default; }

    .answer-letter {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .answer.correct {
      border-color: var(--correct);
      color: var(--correct);
      background: color-mix(in srgb, var(--correct) 12%, var(--surface));
      animation: pop-in 320ms ease both;
    }

    .answer.correct .answer-letter {
      border-color: var(--correct);
      color: var(--correct);
    }

    .answer.wrong {
      border-color: var(--wrong);
      color: var(--wrong);
      background: color-mix(in srgb, var(--wrong) 10%, var(--surface));
      animation: shake 420ms ease both;
    }

    .answer.wrong .answer-letter {
      border-color: var(--wrong);
      color: var(--wrong);
    }

    .feedback {
      min-height: 0;
      margin-top: 16px;
      padding: 0;
      border-radius: 13px;
      font-size: 14px;
    }

    .feedback.visible {
      padding: 13px 15px;
      animation: fade-up 220ms ease both;
    }

    .feedback.is-correct {
      color: var(--correct);
      background: color-mix(in srgb, var(--correct) 10%, var(--surface));
    }

    .feedback.is-wrong {
      color: var(--wrong);
      background: color-mix(in srgb, var(--wrong) 9%, var(--surface));
    }

    .feedback strong { display: block; margin-bottom: 2px; }

    .next, .restart {
      width: 100%;
      min-height: 52px;
      margin-top: 18px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(105deg, var(--accent-strong), #9b69f2);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease;
    }

    .next:hover, .restart:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .next[hidden], .restart[hidden] { display: none; }

    .results { padding: 42px 32px; text-align: center; }
    .results-emoji { margin-bottom: 12px; font-size: 58px; animation: pop-in 500ms cubic-bezier(.2, 1.6, .4, 1) both; }
    .results h1 { margin-bottom: 9px; }
    .results-copy { max-width: 360px; margin: 0 auto; color: var(--muted); }
    .final-score {
      margin: 25px 0 6px;
      color: var(--accent);
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -.05em;
      line-height: 1;
    }
    .score-caption { color: var(--muted); font-size: 13px; }

    @keyframes shake {
      15%, 45%, 75% { transform: translateX(-6px); }
      30%, 60%, 90% { transform: translateX(6px); }
      100% { transform: translateX(0); }
    }
    @keyframes pop-in { from { transform: scale(.96); opacity: .5; } to { transform: scale(1); opacity: 1; } }
    @keyframes fade-up { from { transform: translateY(5px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes signal-pulse { 50% { opacity: .45; } }

    @media (max-width: 440px) {
      body { padding: 28px 14px; }
      .brand { margin-bottom: 12px; }
      .brand-code { display: none; }
      .console-header { min-height: 62px; padding: 12px 18px; }
      .card { border-radius: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
      .answer:not(:disabled):hover, .next:hover, .restart:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main class="quiz">
    <div class="brand">
      <span class="brand-name"><span class="brand-mark" aria-hidden="true">✦</span> Orbit / Deep space division</span>
      <span class="brand-code" aria-hidden="true">TRANSMISSION 01 · EARTH ORBIT</span>
    </div>
    <section class="card" aria-live="polite">
      <header class="console-header">
        <div class="console-title">
          <span class="console-icon" aria-hidden="true">⌖</span>
          <span class="console-heading"><span>MISSION CONTROL</span><strong>Exploration console</strong></span>
        </div>
        <span class="console-status"><span class="status-dot" aria-hidden="true"></span> SYSTEMS ONLINE</span>
      </header>
      <div class="card-content" id="quiz-screen">
        <div class="topline">
          <span id="question-count">Question 1 of 10</span>
          <span class="score">Score <strong id="score">0</strong></span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="1">
          <div class="progress-fill" id="progress"></div>
        </div>
        <p class="eyebrow" id="category">The solar system</p>
        <h1 id="question" tabindex="-1"></h1>
        <p class="hint">Choose the best answer to continue your mission.</p>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback" role="status" aria-live="assertive"></div>
        <button class="next" id="next" type="button" hidden>Next question <span aria-hidden="true">→</span></button>
      </div>
      <div class="results" id="results-screen" hidden>
        <div class="results-emoji" id="result-emoji" aria-hidden="true"></div>
        <p class="eyebrow">Mission complete</p>
        <h1 id="result-title">Great exploring!</h1>
        <p class="results-copy" id="result-copy"></p>
        <div class="final-score" id="final-score"></div>
        <div class="score-caption">correct answers out of 10</div>
        <button class="restart" id="restart" type="button">Launch another mission <span aria-hidden="true">↻</span></button>
      </div>
    </section>
  </main>
  <script>
    const questions = [
      {
        category: "The solar system",
        question: "Which planet has the most confirmed moons?",
        options: ["Jupiter", "Saturn", "Neptune", "Uranus"],
        answer: 1,
        explanation: "Saturn leads the count, with more than 140 confirmed moons."
      },
      {
        category: "Our home planet",
        question: "What is the name of the boundary where Earth's atmosphere meets space?",
        options: ["Van Allen line", "Kármán line", "Horizon line", "Lagrange line"],
        answer: 1,
        explanation: "The Kármán line, about 100 km above sea level, is a widely used boundary of space."
      },
      {
        category: "Deep space",
        question: "What is the nearest star to Earth after the Sun?",
        options: ["Sirius", "Barnard's Star", "Proxima Centauri", "Vega"],
        answer: 2,
        explanation: "Proxima Centauri is about 4.24 light-years away."
      },
      {
        category: "Space history",
        question: "Which spacecraft first carried humans to the Moon's surface?",
        options: ["Apollo 8", "Apollo 10", "Apollo 11", "Gemini 8"],
        answer: 2,
        explanation: "Apollo 11 landed Neil Armstrong and Buzz Aldrin on the Moon in July 1969."
      },
      {
        category: "The red planet",
        question: "What is the name of the enormous extinct volcano on Mars?",
        options: ["Mount Erebus", "Olympus Mons", "Elysium Mons", "Ascraeus Mons"],
        answer: 1,
        explanation: "Olympus Mons is the largest known volcano in the solar system."
      },
      {
        category: "Cosmic science",
        question: "What does a light-year measure?",
        options: ["Time", "Brightness", "Distance", "A star's age"],
        answer: 2,
        explanation: "A light-year is the distance light travels in one year: about 9.46 trillion km."
      },
      {
        category: "The Moon",
        question: "Why do we see nearly the same side of the Moon from Earth?",
        options: ["The Moon does not rotate", "Earth's gravity holds it still", "It rotates once per orbit", "Clouds hide the far side"],
        answer: 2,
        explanation: "The Moon is tidally locked: its rotation period matches its orbit around Earth."
      },
      {
        category: "Space technology",
        question: "Which telescope observes the universe mainly in infrared light?",
        options: ["Hubble Space Telescope", "James Webb Space Telescope", "Kepler Space Telescope", "Chandra X-ray Observatory"],
        answer: 1,
        explanation: "The James Webb Space Telescope is optimized to observe infrared light."
      },
      {
        category: "Beyond the planets",
        question: "What is the asteroid belt located between?",
        options: ["Earth and Mars", "Mars and Jupiter", "Jupiter and Saturn", "Neptune and Pluto"],
        answer: 1,
        explanation: "The main asteroid belt orbits between Mars and Jupiter."
      },
      {
        category: "The universe",
        question: "What is the name of the galaxy that contains our solar system?",
        options: ["Andromeda", "Triangulum", "Whirlpool", "Milky Way"],
        answer: 3,
        explanation: "Our solar system is in the Milky Way, a barred spiral galaxy."
      }
    ];

    const quizScreen = document.getElementById("quiz-screen");
    const resultsScreen = document.getElementById("results-screen");
    const questionCount = document.getElementById("question-count");
    const scoreDisplay = document.getElementById("score");
    const progress = document.getElementById("progress");
    const progressTrack = document.querySelector(".progress-track");
    const category = document.getElementById("category");
    const questionTitle = document.getElementById("question");
    const answers = document.getElementById("answers");
    const feedback = document.getElementById("feedback");
    const nextButton = document.getElementById("next");
    let current = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      const item = questions[current];
      answered = false;
      questionCount.textContent = `Question ${current + 1} of ${questions.length}`;
      scoreDisplay.textContent = score;
      progress.style.width = `${((current + 1) / questions.length) * 100}%`;
      progressTrack.setAttribute("aria-valuenow", current + 1);
      progressTrack.setAttribute("aria-valuetext", `Question ${current + 1} of ${questions.length}`);
      category.textContent = item.category;
      questionTitle.textContent = item.question;
      questionTitle.setAttribute("tabindex", "-1");
      answers.replaceChildren();
      feedback.className = "feedback";
      feedback.replaceChildren();
      nextButton.hidden = true;
      item.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.innerHTML = `<span class="answer-letter">${String.fromCharCode(65 + index)}</span><span>${option}</span>`;
        button.addEventListener("click", () => selectAnswer(index));
        answers.append(button);
      });
    }

    function selectAnswer(selected) {
      if (answered) {
        return;
      }
      answered = true;
      const item = questions[current];
      const buttons = [...answers.querySelectorAll(".answer")];
      buttons.forEach(button => { button.disabled = true; });
      const isCorrect = selected === item.answer;
      buttons[item.answer].classList.add("correct");
      if (isCorrect) {
        score++;
      } else {
        buttons[selected].classList.add("wrong");
      }
      scoreDisplay.textContent = score;
      feedback.className = `feedback visible ${isCorrect ? "is-correct" : "is-wrong"}`;
      const heading = document.createElement("strong");
      heading.textContent = isCorrect ? "Brilliant! ✓" : "Not quite — the right answer is highlighted.";
      const detail = document.createElement("span");
      detail.textContent = item.explanation;
      feedback.append(heading, detail);
      nextButton.textContent = current === questions.length - 1 ? "See your results →" : "Next question →";
      nextButton.hidden = false;
      nextButton.focus();
    }

    function showResults() {
      quizScreen.hidden = true;
      resultsScreen.hidden = false;
      document.getElementById("final-score").textContent = `${score}/10`;
      const emoji = document.getElementById("result-emoji");
      const title = document.getElementById("result-title");
      const copy = document.getElementById("result-copy");
      if (score === 10) {
        emoji.textContent = "🚀";
        title.textContent = "Out of this world!";
        copy.textContent = "A perfect mission. You really know your way around the cosmos.";
      } else if (score >= 7) {
        emoji.textContent = "🌟";
        title.textContent = "Stellar work!";
        copy.textContent = "Your space knowledge is shining bright. The universe is yours to explore.";
      } else if (score >= 4) {
        emoji.textContent = "🪐";
        title.textContent = "Nice orbit!";
        copy.textContent = "A solid trip through the stars. There's always more out there to discover.";
      } else {
        emoji.textContent = "🌙";
        title.textContent = "Keep exploring!";
        copy.textContent = "Every great astronaut starts somewhere. Ready for another launch?";
      }
      document.getElementById("restart").focus();
    }

    nextButton.addEventListener("click", () => {
      if (current === questions.length - 1) {
        showResults();
        return;
      }
      current++;
      renderQuestion();
      questionTitle.focus?.();
    });

    document.getElementById("restart").addEventListener("click", () => {
      current = 0;
      score = 0;
      resultsScreen.hidden = true;
      quizScreen.hidden = false;
      renderQuestion();
      answers.querySelector("button").focus();
    });

    renderQuestion();
  </script>
</body>
</html>
